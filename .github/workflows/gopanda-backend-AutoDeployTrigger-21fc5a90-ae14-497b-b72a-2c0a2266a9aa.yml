name: Trigger auto deployment for gopanda-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/gopanda-backend-AutoDeployTrigger-21fc5a90-ae14-497b-b72a-2c0a2266a9aa.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GOPANDABACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GOPANDABACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GOPANDABACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: gopandaacr21358.azurecr.io
          registryUsername: ${{ secrets.GOPANDABACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GOPANDABACKEND_REGISTRY_PASSWORD }}
          containerAppName: gopanda-backend
          resourceGroup: Gopanda
          imageToBuild: gopandaacr21358.azurecr.io/gopanda-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


