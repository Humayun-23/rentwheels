name: Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name gopandaacr21358

      - name: Build and Push Docker image
        run: |
          # Build the image using the github commit hash as a unique tag
          docker build --platform linux/amd64 -t gopandaacr21358.azurecr.io/gopanda-backend:${{ github.sha }} .
          
          # Push the image to Azure Container Registry
          docker push gopandaacr21358.azurecr.io/gopanda-backend:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            # Update the Container App to use the newly pushed image
            az containerapp update \
              --name gopanda-backend \
              --resource-group Gopanda \
              --image gopandaacr21358.azurecr.io/gopanda-backend:${{ github.sha }}
