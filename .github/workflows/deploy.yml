name: Deploy Backend to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name gopandaacr21358

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            -t gopandaacr21358.azurecr.io/gopanda-backend:${{ github.sha }} .

      - name: Push image
        run: docker push gopandaacr21358.azurecr.io/gopanda-backend:${{ github.sha }}

      - name: Deploy image to ACA
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name gopanda-backend \
              --resource-group Gopanda \
              --image gopandaacr21358.azurecr.io/gopanda-backend:${{ github.sha }}

      - name: Health check
        run: |
          curl --fail --retry 10 --retry-delay 5 https://api.gopanda.in/health
