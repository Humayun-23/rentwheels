# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.gopanda.in;

    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Handle HTTPS traffic
server {
    listen 443 ssl;
    server_name api.gopanda.in;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/api.gopanda.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gopanda.in/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # Route to your FastAPI backend
        proxy_pass http://rentwheels-backend:8000;
        
        # Pass essential headers to your Python app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}